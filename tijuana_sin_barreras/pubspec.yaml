name: tijuana_sin_barreras
description: "Tijuana Sin Barreras — Ruteo accesible y reporte ciudadano de barreras urbanas. HackFox 2026."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_storage: ^12.3.2

  # Google Sign-In (login con cuenta de Google)
  google_sign_in: ^6.2.1

  # Maps & Location
  google_maps_flutter: ^2.9.0
  geolocator: ^13.0.1

  # HTTP (Routes API, Places API, Gemini)
  http: ^1.2.2

  # Image pick & upload
  image_picker: ^1.1.2

  # State management
  provider: ^6.1.2

  # Utilities
  uuid: ^4.5.1
  intl: ^0.19.0
  cached_network_image: ^3.4.1

  # Environment variables (.env)
  flutter_dotenv: ^5.1.0

  # Fonts
  google_fonts: ^6.3.3 # 6.3.0 rompe con Dart >=3.11 (const Map<FontWeight>)

  # Text-to-Speech (accesibilidad auditiva)
  flutter_tts: ^4.2.0

  # SVG (used for optional vector logo asset)
  flutter_svg: ^2.0.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - .env
